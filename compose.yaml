# Start:   docker compose up -d --build      Open: http://<host>:8585
# Stop:    docker compose down               (your data is kept in the named volume)
# Wipe:    docker compose down -v --rmi local   (removes data and the image: nothing is left behind)
# External drive for the data: add  -f compose.external-drive.yaml  (see docs/DOCKER.md)
services:
  jobhunter:
    build:
      context: .
      args:
        WITH_BROWSER: "${WITH_BROWSER:-1}"   # WITH_BROWSER=0 docker compose up -d --build = slim image without browser scraping (Google/Meta/Apple/Microsoft)
    image: jobhunter:latest
    container_name: jobhunter
    restart: unless-stopped        # comes back after a reboot or crash
    ports:
      - "8585:8585"                # host:container. Change the LEFT number if 8585 is taken (e.g. by Pi-hole)
    volumes:
      - jobhunter-data:/app/data   # jobs, notes and all dashboard settings
      # Optional: change port/host/db location or manual links with your own config file:
      # - ./config.yaml:/app/config.yaml:ro
    environment:
      TZ: Europe/Amsterdam
      JOBHUNTER_AI_API_KEY: ${JOBHUNTER_AI_API_KEY:-}   # optional: key for the AI agent (Settings -> AI agent); keeps it out of the database
    # ---- Be a good neighbour on a shared Raspberry Pi (media server, Pi-hole, ...) -------------------------
    cpus: 1.0                      # never more than one core (of four on a Pi 4)...
    cpu_shares: 128                # ...and a small weight: when anything else wants CPU, it wins (default is 1024)
    mem_limit: 1g                  # hard cap (idle use is ~60-80 MB; Chromium adds ~300-500 MB only while it runs)
    oom_score_adj: 500             # if the Pi ever runs out of memory, the kernel stops THIS first, not your media server
    pids_limit: 256
    shm_size: "512m"               # Chromium needs more shared memory than Docker's 64 MB default
    logging:                       # keep logs small: fewer writes to the SD card
      driver: json-file
      options: {max-size: "5m", max-file: "2"}
    security_opt:
      - no-new-privileges:true

volumes:
  jobhunter-data:
