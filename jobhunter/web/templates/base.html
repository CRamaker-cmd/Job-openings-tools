<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block title %}Job Hunter{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<header><b>🎯 Job Hunter</b>
<nav><a href="{{ url_for('index') }}">Jobs</a><a href="{{ url_for('profile') }}">My snippets</a><a href="{{ url_for('status') }}">Sources</a></nav>
<a href="{{ url_for('export') }}">CSV</a></header>
<main>{% block body %}{% endblock %}</main>
<script>
async function post(url, body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});return r.ok}
async function setStatus(id,status,el){if(await post('/api/job/'+id+'/status',{status})){const c=document.getElementById('job-'+id);
 if(c&&!document.body.dataset.detail){ if(status==='starred'){c.classList.add('starred')}else{c.remove()} } else location.reload()}}
function copyText(id,btn){const t=document.getElementById(id);navigator.clipboard.writeText(t.value??t.textContent).then(()=>{const o=btn.textContent;btn.textContent='Copied ✓';setTimeout(()=>btn.textContent=o,1200)})}
</script></body></html>
